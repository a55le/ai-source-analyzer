[project]
name = "ai-source-analyzer"
version = "0.1.0"
description = ""
authors = [
    {name = "Iurii Shikov",email = "iurii.shikov@proton.me"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "rich (>=14.3.3,<15.0.0)",
    "typer (>=0.24.1,<0.25.0)"
]

[tool.poetry]
packages = [{include = "ai_source_analyzer", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
analyze-ai-source="ai_source_analyzer.main:app"